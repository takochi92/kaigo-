# 国の介護事業所オープンデータを取り込んでサイトをビルドし、GitHub Pages に公開する
name: Build and deploy

on:
  push:
    branches: [ccr-0d9e948d-9nfoh6, main]
  schedule:
    # 毎月5日 3:17（日本時間 12:17）に最新データで再ビルド
    - cron: "17 3 5 * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Claude の作業ログ用に全ブランチの履歴を取得
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # 先に国のデータを取り込んでビルド（Pages が未設定でもデータ取得の成否がわかるように）
      - name: Build (download open data)
        run: node scripts/build.mjs
        env:
          # 独自ドメインにしたらリポジトリの Variables に SITE_URL を設定
          SITE_URL: ${{ vars.SITE_URL || 'https://takochi92.github.io/kaigo-' }}
      - name: Claude 作業ログ
        run: node scripts/claude-log.mjs --out dist/claude
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://takochi92.github.io/kaigo-' }}
      - name: Summary
        run: |
          echo "### ビルド結果" >> "$GITHUB_STEP_SUMMARY"
          echo "- ページ数: $(find dist -name '*.html' | wc -l)" >> "$GITHUB_STEP_SUMMARY"
          echo "- サイズ: $(du -sh dist | cut -f1)" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
