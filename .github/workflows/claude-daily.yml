# Claude の作業ログを更新し、毎朝「前日の日報」を Issue で通知する
#  - どのブランチに push されても log.json を作り直し、claude-log ブランチに置く
#    （ダッシュボード・ウィジェットはここを読むので、サイトを再公開しなくても最新になる）
#  - 毎朝 7:47（日本時間）に前日の作業があれば Issue を立てる → GitHub アプリにプッシュ通知が届く
name: Claude daily log

on:
  push:
    branches-ignore: [claude-log]
  schedule:
    - cron: "47 22 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "日報を出す日付（YYYY-MM-DD / today / yesterday）"
        default: "yesterday"

permissions:
  contents: write
  issues: write

concurrency:
  group: claude-log
  cancel-in-progress: false

jobs:
  log:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 全ブランチ（Claude のセッションごとのブランチ）の履歴を取得
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build log.json
        run: node scripts/claude-log.mjs --out _claude
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://takochi92.github.io/kaigo-' }}

      - name: Publish to claude-log branch
        run: |
          cd _claude
          git init -q -b claude-log
          git add .
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -qm "Claude 作業ログを更新"
          git push -qf "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" claude-log
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Daily report issue
        if: github.event_name != 'push'
        run: |
          body="$(node scripts/claude-log.mjs --report "${DATE}")"
          if [ -z "$body" ]; then
            echo "作業がなかったので通知しません"
            exit 0
          fi
          day="$(echo "$body" | head -1 | grep -oE '[0-9]{4}-[0-9]{2}-[0-9]{2}')"
          title="Claude 日報 ${day}"
          if gh issue list --state all --search "\"${title}\" in:title" --json title --jq '.[].title' | grep -qx "$title"; then
            echo "すでに通知済み: $title"
            exit 0
          fi
          # 前の日報は閉じておく
          for n in $(gh issue list --state open --search "\"Claude 日報\" in:title" --json number --jq '.[].number'); do
            gh issue close "$n" --reason completed
          done
          gh issue create --title "$title" --body "$body" --assignee "${{ github.repository_owner }}"
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DATE: ${{ inputs.date || 'yesterday' }}
