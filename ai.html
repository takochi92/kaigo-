<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AIに質問｜かいごナビ</title>
<meta name="description" content="介護制度や施設、手続きについてAIに質問できます。状況を書くと、次にやること・相談先を案内します。">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<header id="site-header"></header>

<main class="wrap">
  <h1>AIに質問</h1>
  <p class="lead">介護の制度・手続き・施設選びなど、気になることを自由に書いてください。状況をくわしく書くほど、具体的に案内できます。</p>

  <div class="note">
    AIの回答は一般的な情報で、誤りを含むことがあります。医療・法律・お金に関わる判断は、地域包括支援センター・ケアマネジャー・医師・市区町村などに必ず確認してください。<br>
    <strong>氏名・住所・電話番号などの個人情報は入力しないでください。</strong>
  </div>

  <div class="suggest" id="suggest">
    <button class="chip" type="button">親が来週退院します。何を準備すればいい？</button>
    <button class="chip" type="button">要介護2の母、デイサービスは週何回使える？</button>
    <button class="chip" type="button">特養とグループホーム、どちらが向いている？</button>
    <button class="chip" type="button">訪問介護事業所を開業したい。必要な人員は？</button>
  </div>

  <section class="chat" aria-label="AIとの会話">
    <div class="chat-log" id="chat-log" aria-live="polite"></div>
    <form class="chat-form" id="chat-form">
      <label for="chat-input" class="muted small" style="position:absolute;left:-9999px">質問を入力</label>
      <textarea id="chat-input" rows="2" placeholder="例：一人暮らしの父の物忘れが増えてきました。どこに相談すれば？" required></textarea>
      <button class="btn" type="submit" id="chat-send">送信</button>
    </form>
  </section>
  <p class="muted small" id="chat-mode"></p>
</main>

<footer id="site-footer"></footer>
<script src="assets/main.js"></script>
<script src="data/faq.js"></script>
<script src="assets/chat.js"></script>
</body>
</html>
