<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Claude ウィジェット</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0b0d12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Claude今日">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="stylesheet" href="claude.css">
</head>
<body class="widget-body">
<div>
  <a class="wgt" id="wgt" href="./">
    <div class="wgt-top"><img src="icon.svg" alt=""><span>CLAUDE · TODAY</span><span class="when" id="w-when">…</span></div>
    <div class="wgt-big"><b id="w-count">–</b><span id="w-unit">commits</span></div>
    <div class="wgt-sub"><span>📄 <em id="w-files">–</em> new</span><span>🔥 <em id="w-streak">–</em> days</span><span class="add" id="w-lines"></span></div>
    <div class="wgt-spark" id="w-spark" aria-hidden="true"></div>
    <ul class="wgt-list" id="w-list"></ul>
  </a>
  <div class="wgt-switch">
    <button class="pill-btn" type="button" id="w-size">↔ 横長にする</button>
    <a class="pill-btn" href="./">ダッシュボード</a>
  </div>
</div>
<script src="data.js"></script>
<script>
(function () {
  var L = window.ClaudeLog;
  var $ = function (id) { return document.getElementById(id); };
  var wide = false;
  try { wide = localStorage.getItem("claude-widget-wide") === "1"; } catch (e) {}

  function applySize() {
    $("wgt").classList.toggle("wide", wide);
    $("w-size").textContent = wide ? "▢ 正方形にする" : "↔ 横長にする";
  }
  $("w-size").onclick = function () {
    wide = !wide;
    try { localStorage.setItem("claude-widget-wide", wide ? "1" : "0"); } catch (e) {}
    applySize();
  };
  applySize();

  function draw(log) {
    var today = L.todayJst();
    var d = log.days.find(function (x) { return x.date === today; });
    var src = d || log.days[0];
    $("w-count").textContent = d ? d.commits.length : 0;
    $("w-unit").textContent = d ? "commits today" : "today · zzz";
    $("w-files").textContent = d ? d.created.length : 0;
    $("w-streak").textContent = log.totals.streak;
    $("w-lines").textContent = d ? "+" + d.add : "";
    $("w-when").textContent = new Date(log.generatedAt).toLocaleTimeString("ja-JP", { hour: "2-digit", minute: "2-digit" });
    var series = L.series(log, 14);
    var max = Math.max.apply(null, series.map(function (s) { return s.count; }).concat(1));
    $("w-spark").innerHTML = series.map(function (s) {
      return '<i class="' + (s.count ? "" : "zero") + '" style="height:' + Math.max(8, s.count / max * 100) + '%" title="' + s.date + '"></i>';
    }).join("");
    var items = src ? src.commits.slice(0, 3) : [];
    $("w-list").innerHTML = items.map(function (c) {
      return '<li class="k-' + c.kind + '">' + (d ? "" : src.date.slice(5) + " ") + L.esc(c.time + " " + c.title) + "</li>";
    }).join("") || "<li>まだ作業はありません</li>";
  }

  function refresh() { L.load().then(draw).catch(function () { $("w-unit").textContent = "offline"; }); }
  refresh();
  setInterval(function () { if (!document.hidden) refresh(); }, 10 * 60 * 1000);
  document.addEventListener("visibilitychange", function () { if (!document.hidden) refresh(); });
})();
</script>
</body>
</html>
